[project]
name = "mle-trajectories"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "litellm>=1.97.0",
    "psutil>=7.2.2",
    "skorch>=1.4.0",
    "stratum-ai",
    "tenacity>=8.0",   # litellm retry path (num_retries) imports it lazily
    "torch>=2.13.0",
    "xgboost>=3.3.0",
]

[project.scripts]
pipeline-analyzer = "pipeline_analyzer.__main__:main"
pipeline-runtime = "pipeline_analyzer.runtime:main"
skrubify = "skrubify.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/pipeline_analyzer", "tools/skrubify"]

# The default PyPI torch wheel is built against CUDA 13.0, which this machine's
# driver (12.7) refuses -- torch.cuda.is_available() comes back False and every
# pipeline silently falls back to CPU. Pin torch to the cu126 index, the same
# build mle-star uses on this box.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
stratum-ai = { git = "https://github.com/deem-data/stratum.git", rev = "8b7f7ba3c632af28b138c388695988170d6874c3" }
torch = { index = "pytorch-cu126" }
