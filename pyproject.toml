[project]
name = "mle-trajectories"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "litellm>=1.97.0",
    "psutil>=7.2.2",
    "skorch>=1.4.0",
    "stratum-ai",
    "tenacity>=8.0",   # litellm retry path (num_retries) imports it lazily
    "torch>=2.13.0",
    "xgboost>=3.3.0",
]

[project.scripts]
pipeline-analyzer = "pipeline_analyzer.__main__:main"
pipeline-runtime = "pipeline_analyzer.runtime:main"
skrubify = "skrubify.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/pipeline_analyzer", "tools/skrubify"]

[tool.uv.sources]
stratum-ai = { git = "https://github.com/deem-data/stratum.git", rev = "834dc02980379e8d6b97a04baeedc4ad3a888da6" }
