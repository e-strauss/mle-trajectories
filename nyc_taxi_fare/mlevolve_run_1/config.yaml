desc_file: null
goal: 'File descriptions

  train.csv - Input features and target `cost` values for the training set (about
  55M rows). test.csv - Input features for the test set (about 10K rows). Your goal
  is to predict `cost` for each row. sample_submission.csv - a sample submission file
  in the correct format (columns record_id and cost). This file ''predicts'' a single
  constant cost for every row, namely the mean cost over the training set.

  Data fields

  ID

  record_id - Opaque string uniquely identifying each row, in both the training and
  test sets. Treat it purely as an identifier; its internal structure carries no meaning.
  Required in your submission CSV. Not strictly needed in the training set, but can
  be useful to simulate a ''submission file'' while doing cross-validation within
  the training set.

  Features

  start_time - timestamp value indicating when the recorded event started. origin_x
  - float, first spatial coordinate of the origin point, in decimal degrees. origin_y
  - float, second spatial coordinate of the origin point, in decimal degrees. dest_x
  - float, first spatial coordinate of the destination point, in decimal degrees.
  dest_y - float, second spatial coordinate of the destination point, in decimal degrees.
  unit_count - integer count of billable units associated with the record.

  Target

  cost - float, the cost recorded for the event. This value is only present in the
  training set; it is what you are predicting for the test set and it is required
  in your submission CSV.

  Evaluation

  The evaluation metric for this competition is the root mean-squared error or RMSE.
  RMSE measures the difference between the predictions of a model, and the corresponding
  ground truth. A large RMSE is equivalent to a large average error, so smaller values
  of RMSE are better. One nice property of RMSE is that the error is given in the
  units being measured, so you can tell very directly how incorrect the model might
  be on unseen data.

  Submission File

  For each `record_id` in the test set, you must predict a value for the `cost` variable.
  The file should contain a header and have the following format CSV record_id,cost
  0f2a1c9d4b,11.00 7c58e0a213,12.05 b9143de6f0,11.23 2e7ab0c581,14.17 5d90fc31ae,15.12'
eval: null
