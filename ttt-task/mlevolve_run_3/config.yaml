preprocess_data: true
copy_data: false
exp_name: 20260911_232300_trackthetrackers-task
exp_id: trackthetrackers-task
torch_hub_dir: ''
pretrain_model_dir: ''
exec:
  timeout: 14400
  agent_file_name: runfile.py
agent:
  steps: 10
  time_limit: 57600
  initial_drafts: 2
  seed: 42
  data_preview: true
  code:
    model: gemini-3.8-flash
    temp: 1.0
    base_url: ${oc.env:GOOGLE_BASE_URL,''}
    api_key: ${oc.env:GOOGLE_API_KEY}
  feedback:
    model: gemini-3.8-flash
    temp: 1.0
    base_url: ${oc.env:GOOGLE_BASE_URL,''}
    api_key: ${oc.env:GOOGLE_API_KEY}
  check_data_leakage: true
  fusion_vs_evolution_prob: 0.3
  branch_fusion_trigger_prob: 1.0
  max_fusion_drafts: 2
  use_global_memory: true
  memory_similarity_threshold: 0.7
  memory_embedding_device: cuda
  memory_embedding_model_path: BAAI/bge-base-en-v1.5
  search:
    max_debug_depth: 20
    debug_prob: 1.0
    num_drafts: 5
    metric_improvement_threshold: 0.0001
    back_debug_depth: 3
    num_bugs: 1
    num_improves: 3
    topk_max_improves: 10
    max_improve_failure: 3
    parallel_search_num: 1
    branch_stagnation_threshold: 3
    topk_stagnation_threshold: 6
    top_candidates_size: 20
    stagnation_window: 4
    num_gpus: 4
    explore_switch_start: 0.5
    explore_switch_end: 0.7
    min_exploration_weight: 0.2
    topk_early_k: 5
    topk_early_max_per_branch: 3
    topk_late_k: 3
    topk_late_max_per_branch: 2
    force_backprop_late_threshold: 0.8
    force_backprop_late_prob: 0.5
    force_backprop_mid_threshold: 0.4
    force_backprop_mid_modulo: 3
    recent_best_window: 4
    fusion_min_time_hours: 6.0
    fusion_max_time_hours: 10.0
    fusion_min_successful_nodes: 2
    fusion_min_branches: 2
    use_stagnation_detection: true
  decay:
    exploration_constant: 1.414
    lower_bound: 0.5
    alpha: 0.01
    phase_ratios:
    - 0.3
    - 0.7
  use_diff_mode: true
  use_stepwise_generation: true
  use_evolution: true
  use_fusion: true
  use_aggregation: true
  leakage_max_threshold: 0.999
  leakage_min_threshold: 1.0e-06
start_cpu_id: '0'
cpu_number: '60'
coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: None model
use_grading_server: false
init_solution:
  use: false
